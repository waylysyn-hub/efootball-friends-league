name: Regression Checks
on:
  push:
    branches: [main, 'fix/**', 'refactor/**']
  pull_request:
permissions:
  contents: read
jobs:
  authenticated-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EFL_LOCAL_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start disposable Supabase Auth and PostgreSQL
        run: |
          export EFL_E2E_CONFIG="$RUNNER_TEMP/efl-local-supabase.json"
          printf 'EFL_E2E_CONFIG=%s\n' "$EFL_E2E_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/efl-local"
          supabase --help
          supabase init --help
          supabase start --help
          supabase status --help
          supabase init --workdir "$RUNNER_TEMP/efl-local"
          supabase start --workdir "$RUNNER_TEMP/efl-local" --exclude storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/efl-start.log" 2>&1
          supabase status --workdir "$RUNNER_TEMP/efl-local" --output json > "$EFL_E2E_CONFIG"
          node tests/e2e/seed.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-supabase-checks
          path: |
            playwright-report/e2e/
            test-results/e2e/
          retention-days: 7
      - name: Remove disposable local database
        if: always()
        run: |
          supabase stop --help
          supabase stop --workdir "$RUNNER_TEMP/efl-local" --no-backup
  database-safeupdate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: eradman/pg-safeupdate
          ref: 37dbc9c4acf5e2504adf2b218e9c6b41751022f3
          path: .safeupdate-test
          persist-credentials: false
      - name: Prepare isolated PostgreSQL with the production API guard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16
          make -C .safeupdate-test PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no
          sudo make -C .safeupdate-test PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no install
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"
          sudo -u postgres createdb --owner="$USER" efl_safeupdate_test
      - name: Reproduce the old failure and verify the fix with safeupdate enabled
        run: |
          EFL_NATIVE_POSTGRES=1 PGHOST=/var/run/postgresql PGUSER="$USER" PGDATABASE=efl_safeupdate_test node --test tests/database.test.mjs
  security-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            playwright-report/
            test-results/
          retention-days: 7
