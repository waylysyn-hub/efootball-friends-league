name: Regression Checks
on:
  push:
    branches: [main, 'fix/**', 'refactor/**']
  pull_request:
permissions:
  contents: read
jobs:
  database-safeupdate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: eradman/pg-safeupdate
          ref: 37dbc9c4acf5e2504adf2b218e9c6b41751022f3
          path: .safeupdate-test
          persist-credentials: false
      - name: Prepare isolated PostgreSQL with the production API guard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16
          make -C .safeupdate-test PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no
          sudo make -C .safeupdate-test PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no install
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"
          sudo -u postgres createdb --owner="$USER" efl_safeupdate_test
      - name: Reproduce the old failure and verify the fix with safeupdate enabled
        run: |
          EFL_NATIVE_POSTGRES=1 PGHOST=/var/run/postgresql PGUSER="$USER" PGDATABASE=efl_safeupdate_test node --test tests/database.test.mjs
  security-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
