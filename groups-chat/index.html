<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle · Groups & Friends Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <div class="login-brand">
        <div class="brand-logo lg">C</div>
        <h1>Circle Chat</h1>
        <p class="muted">Sign in with your league account</p>
      </div>
      <div class="form-group">
        <label>Player</label>
        <select id="loginUsername">
          <option value="">— SELECT PLAYER —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" />
      </div>
      <p id="loginError" class="login-error" hidden></p>
      <button class="btn-primary" type="button" onclick="handleLogin()">Sign in</button>
      <a href="../index.html" class="login-back">← Back to Tournament Hub</a>
    </div>
  </div>

  <div class="app hidden" id="appRoot">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">C</div>
        <div class="brand-text">
          <span class="brand-name">Circle</span>
          <span class="brand-sub">Groups &amp; Friends</span>
        </div>
      </div>

      <nav class="nav">
        <a href="../index.html" class="nav-item nav-external">
          <span class="nav-icon">🏛</span>
          <span>Tournament Hub</span>
        </a>
        <button class="nav-item active" data-view="groups" type="button">
          <span class="nav-icon">▦</span>
          <span>Groups</span>
        </button>
        <button class="nav-item" data-view="invites" type="button">
          <span class="nav-icon">✦</span>
          <span>Invitations</span>
          <span class="badge" id="inviteBadge">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="me">
          <div class="avatar" id="meAvatar">?</div>
          <div class="me-text">
            <span class="me-name" id="meName">—</span>
            <span class="me-status">● Online</span>
          </div>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme" type="button">
          <span class="theme-icon">🌙</span>
        </button>
        <button class="logout-btn" id="logoutBtn" title="Sign out" type="button">⏻</button>
      </div>
    </aside>

    <main class="main">
      <section class="view active" id="view-groups">
        <header class="view-header">
          <div>
            <h1>Groups</h1>
            <p class="muted">Your league chat circles.</p>
          </div>
          <div class="view-header-actions">
            <button class="btn-create" id="createGroupBtn" type="button">+ New Group</button>
            <div class="search">
              <span>⌕</span>
              <input type="text" id="groupSearch" placeholder="Search groups…" />
            </div>
          </div>
        </header>
        <div class="groups-grid" id="groupsGrid"></div>
      </section>

      <section class="view" id="view-chat">
        <header class="chat-header">
          <button class="back-btn" id="backToGroups" type="button">←</button>
          <div class="chat-title">
            <div class="avatar" id="chatAvatar">G</div>
            <div>
              <h2 id="chatGroupName">Group</h2>
              <span class="muted" id="chatGroupMeta">0 members</span>
            </div>
          </div>
        </header>
        <div class="chat-invite-bar hidden" id="chatInviteBar">
          <select id="invitePlayerSelect"></select>
          <button type="button" class="btn-create sm" id="sendInviteBtn">Invite</button>
        </div>
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off" />
          <button type="submit" class="send-btn" id="sendBtn">➤</button>
        </form>
      </section>

      <section class="view" id="view-invites">
        <header class="view-header">
          <div>
            <h1>Invitations</h1>
            <p class="muted">Pending group invites.</p>
          </div>
        </header>
        <div class="invites-list" id="invitesList"></div>
        <div class="empty" id="invitesEmpty" hidden>
          <div class="empty-emoji">📭</div>
          <h3>You're all caught up</h3>
          <p class="muted">No pending invitations right now.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- CREATE GROUP MODAL -->
  <div class="modal hidden" id="createGroupModal">
    <div class="modal-box">
      <h3>New Group</h3>
      <form id="createGroupForm">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="newGroupName" required maxlength="80" placeholder="e.g. Match Day Chat" />
        </div>
        <div class="form-group">
          <label>Emoji</label>
          <input type="text" id="newGroupEmoji" maxlength="4" placeholder="⚽" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="newGroupDesc" maxlength="200" placeholder="What's this group for?" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelCreateGroup">Cancel</button>
          <button type="submit" class="btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
