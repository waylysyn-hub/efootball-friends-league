<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>فتح دوري الأصدقاء</title>
<script>
(() => {
  const target = new URL('index.html', location.href);
  target.searchParams.set('ui', '20260928-modern-v2');
  if (location.search.includes('fixture=')) {
    const fixture = new URLSearchParams(location.search).get('fixture');
    if (fixture) target.searchParams.set('fixture', fixture);
  }
  target.hash = location.hash;
  location.replace(target);
})();
</script>
</head>
<body>جارٍ فتح النسخة الحديثة من دوري الأصدقاء…</body>
</html>
